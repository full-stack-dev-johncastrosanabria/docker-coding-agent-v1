# gates/G1a/agent.yaml — Gate G1a probe agent (tasks.md T016).
#
# The minimum config that exercises the V1 primary backend: the pinned Docker Agent
# `claude-code` harness at effort high, with no `harness.model`, so the authenticated CLI
# default is used (research R1). Config version 15 is what V1 pins (E1); the pinned binary's
# strict v15 parser is the compatibility authority, so this file is validated with
# `docker agent debug config` rather than against the root JSON schema.
#
# No `instruction` is set: for harness agents Docker Agent does not forward injected
# instructions to the harness (E4), so an instruction here would be inert and would imply a
# control this gate does not have. The whole task arrives as the run's message argument.
version: 15

metadata:
  description: Gate G1a probe agent - trivial Claude Pro execution in a mountless sandbox
  version: "0.1.0"

agents:
  root:
    description: >
      Minimal probe agent for gate G1a. It proves only that the pinned Claude Code harness
      executes under the accepted G4 network policy on a Claude Pro subscription; it carries
      no repository code and no project instructions.
    harness:
      type: claude-code
      effort: high
