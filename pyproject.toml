# Minimal packaging for the `dca` command. DCA reads its runtime assets and gate evidence from this
# checkout, so install it EDITABLE (`pip install -e .`); a copied install refuses to run.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-coding-agent"
version = "0.2.0.dev0"
description = "Run a bounded coding task in a disposable Docker Sandbox, verify it, and report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dca = "dca.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["dca"]
