agents:
  root:
    description: >
      Root coding agent for one bounded task. It classifies the task, builds context, edits,
      verifies, delegates investigation to the researcher and independent review to the reviewer.
    instruction_file: instructions/root.md
    model: chatgpt/gpt-5.5
    safety: strict
    max_iterations: 150
    max_consecutive_tool_calls: 25
    max_tool_result_tokens: 8000
    max_old_tool_call_tokens: 40000
    session_compaction: true
    compaction_threshold: 0.8
    sub_agents:
      - researcher
      - reviewer
    skills:
      - repository-navigation
      - root-cause-debugging
      - verification
      - change-receipt
    toolsets:
      - type: filesystem
      - type: shell
    hooks:
      pre_tool_use:
        - matcher: "*"
          hooks:
            - type: command
              name: dca-gate
              command: /opt/dca/bin/dca-gate
              on_error: block
      on_agent_switch:
        - type: command
          name: dca-fingerprint
          command: /opt/dca/bin/dca-fingerprint
          on_error: ignore
      subagent_stop:
        - type: command
          name: dca-fingerprint
          command: /opt/dca/bin/dca-fingerprint
          on_error: ignore

  researcher:
    description: >
      Read-only investigator. It answers one bounded question with cited evidence and changes
      nothing.
    instruction_file: instructions/researcher.md
    readonly: true
    model: chatgpt/gpt-5.5
    safety: strict
    max_iterations: 150
    max_consecutive_tool_calls: 25
    max_tool_result_tokens: 8000
    max_old_tool_call_tokens: 40000
    session_compaction: true
    compaction_threshold: 0.8
    toolsets:
      - type: filesystem
        readonly: true
    hooks:
      pre_tool_use:
        - matcher: "*"
          hooks:
            - type: command
              name: dca-gate
              command: /opt/dca/bin/dca-gate
              on_error: block
      on_agent_switch:
        - type: command
          name: dca-fingerprint
          command: /opt/dca/bin/dca-fingerprint
          on_error: ignore
      subagent_stop:
        - type: command
          name: dca-fingerprint
          command: /opt/dca/bin/dca-fingerprint
          on_error: ignore

  reviewer:
    description: >
      Independent adversarial reviewer. It reads the candidate and three fixed git commands, and
      must leave the candidate byte-identical.
    instruction_file: instructions/reviewer.md
    model: chatgpt/gpt-5.5
    safety: strict
    max_iterations: 150
    max_consecutive_tool_calls: 25
    max_tool_result_tokens: 8000
    max_old_tool_call_tokens: 40000
    session_compaction: true
    compaction_threshold: 0.8
    toolsets:
      - type: filesystem
        readonly: true
      - type: script
        shell:
          git_diff:
            cmd: git --no-pager diff --no-ext-diff
            description: Show the candidate's uncommitted changes. Takes no arguments.
          git_status:
            cmd: git status --short --branch
            description: Show the candidate's working-tree status. Takes no arguments.
          git_log:
            cmd: git --no-pager log --oneline --no-decorate -n 50
            description: Show the candidate's recent commits. Takes no arguments.
    hooks:
      pre_tool_use:
        - matcher: "*"
          hooks:
            - type: command
              name: dca-gate
              command: /opt/dca/bin/dca-gate
              on_error: block
      on_agent_switch:
        - type: command
          name: dca-fingerprint
          command: /opt/dca/bin/dca-fingerprint
          on_error: ignore
      subagent_stop:
        - type: command
          name: dca-fingerprint
          command: /opt/dca/bin/dca-fingerprint
          on_error: ignore
