# runtime/agents/codex.yaml - the Codex backend's Docker Agent config (tasks.md T055).
#
# THREE AGENTS, ONE POLICY PIPELINE. root, researcher and reviewer are the logical agents; the
# backend is the Codex/ChatGPT provider they all run on. Every tool call any of them makes passes
# the `pre_tool_use` hook into /opt/dca/bin/dca-gate, which evaluates runtime/policy/actions.yaml -
# the same file, the same code, that Claude's managed PreToolUse hook evaluates.
#
# `permissions` HAS ONLY A DENY LIST, and that is the whole point. The deny patterns are generated
# from actions.yaml by src/dca/policy_rules.py, so they cannot drift from the policy. There is no
# `allow` and no `ask`: a custom allow rule short-circuits Docker Agent's approval pipeline, so the
# call would execute WITHOUT dca-gate ever seeing it. Native denies are acceptable because they are
# at least as strict as the gate - they can only reject earlier, never permit.
#
# `safety: strict` is declared on every agent as the default, and the launcher additionally passes
# an explicit `--safety strict` on every execution (research R20, E18). The flag is what guarantees
# it at runtime; this declaration is what makes a config read alone say the same thing. `restricted`
# is never used, and dca exposes no way to change the mode.
#
# THE REVIEWER HAS NO AGENT-LEVEL `readonly`, on purpose. That flag filters every tool without a
# read-only annotation - which removes the `script` tools the review depends on (E18). Its
# read-only property therefore rests on its effective capability set (a read-only filesystem
# toolset plus three fixed, argument-free git commands), on class-27 gate enforcement, and on the
# before/after workspace fingerprints the launcher compares.
#
# Skills resolve ONLY from <KIT_DIR>/skills, because every execution receives
# DOCKER_AGENT_KIT_DIR=/opt/dca from the launcher. The name list below is a filter, not an
# isolation mechanism: without the kit directory a repository could ship a same-named skill
# (research R17, E18). No runtime skill declares `context: fork`.
#
# `instruction_file` is RELATIVE, because the pinned v15 parser refuses an absolute path or any
# path outside the config's own directory. The kit therefore stages this file as
# <KIT_DIR>/agents/codex.yaml with byte-identical copies of runtime/instructions/*.md beside it at
# <KIT_DIR>/agents/instructions/, which is also the config that `docker agent debug config`,
# `debug toolsets` and `debug skills` are run against - so what is validated is what ships.
#
# Native ceilings come from runtime/policy/limits.yaml `native_ceilings` and are static defense in
# depth. They carry the PLANNED maxima, because a static config cannot know the classification in
# advance; direct/planned semantics are enforced by the host launcher from `host_limits`.
version: "15"

metadata:
  description: docker-coding-agent-v1 Codex backend
  version: "1.0.0"

# Run-wide, shared by every agent and sub-session in the run (schema: BudgetConfig).
budget:
  max_tokens: 8000000

