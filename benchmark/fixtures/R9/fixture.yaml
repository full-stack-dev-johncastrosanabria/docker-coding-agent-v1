  "task": "Add order reservations to the inventory package. A reservation holds stock for an order without shipping it.\n\n- Stock.reserve(order_id, sku, qty) holds qty of sku for order_id. It raises ValueError if qty is not a positive integer, if order_id already has a reservation, or if not enough stock is available.\n- Stock.available(sku) is the quantity on hand minus everything reserved for that SKU.\n- Stock.release(order_id) cancels a reservation. An unknown order_id raises KeyError.\n- Stock.fulfill(order_id) ships the reserved quantity (on hand goes down) and removes the reservation. An unknown order_id raises KeyError.\n- Stock.ship(sku, qty) must not ship stock that is reserved for an order: it may only use the available quantity.\n- inventory/report.py gains availability_report(stock): one 'SKU on_hand available' line per SKU, sorted by SKU. stock_report stays as it is.\n\nAdd tests for the new behavior.",
